[package]
name = "humanify-ag-dev"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The measurement harness (docs/dev-harness.md): every instrument is a verb
# of this binary, run as `cargo dev <verb>`. Never part of the release
# artifact.
[[bin]]
name = "humanify-ag-dev"
path = "src/main.rs"

[dependencies]
# The pipeline's key registry (to validate --pipeline-set keys and read
# HEAD's defaults) and the shared registry machinery (`registry`).
humanify-ag-cli = { path = "../humanify-ag-cli" }
# The one subprocess owner (drained pipes, one deadline, group kill).
humanify-ag-core = { path = "../humanify-ag-core" }
# JSON the way JavaScript writes it (the JS spelling of a card).
humanify-ag-model = { path = "../humanify-ag-model" }
# The ONE stub LLM (e2e, ask-trace, `stub-llm serve`) — the harness is
# not a product binary, so it links the test support directly.
humanify-ag-testkit = { path = "../humanify-ag-testkit" }
# The eval scorer parses emitted trees with the pipeline's own parse
# (`humanify_ag_core::ingest`) and walks its AST; match-truth's
# canonicalizer parses a slice into the same arena.
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_estree.workspace = true
oxc_span.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
# The censuses parse crates/ (clones, slop).
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
flate2.workspace = true
memchr.workspace = true

[lints]
workspace = true
