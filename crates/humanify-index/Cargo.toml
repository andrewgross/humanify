[package]
name = "humanify-index"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The offline library fingerprint index builder (docs/design/library-index.md)"

[[bin]]
name = "humanify-index"
path = "src/main.rs"

[dependencies]
humanify-core = { path = "../humanify-core" }
humanify-model = { path = "../humanify-model" }
mimalloc.workspace = true
oxc_allocator.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true

[dev-dependencies]
# its statistics, for the allocator test (main_test.rs)
mimalloc = { workspace = true, features = ["extended"] }

[lints]
workspace = true
