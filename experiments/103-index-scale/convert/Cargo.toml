# exp103's one-off converter: a humanify-library-index/2 directory -> /3 (the
# lookup tables derived from its row tables by humanify-core's own encoder).
# Lab code, deliberately OUTSIDE the workspace: the pipeline and the builder
# read and write /3 only (no backwards compatibility in the crates).
[package]
name = "exp103-convert"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
humanify-core = { path = "../../../crates/humanify-core" }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
serde = "=1.0.228"
